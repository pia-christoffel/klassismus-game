<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Der Berg</title>
  <!-- Schriften (ohne Internet greifen die Fallbacks in style.css) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>

  <!-- Spielfeld -->
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="work"></div>
  </div>

  <!-- Nur auf Handy/Tablet: Bildschirm-Tasten & Hinweis zum Drehen -->
  <div id="touch"></div>
  <div id="rotate"></div>

  <!-- Screens (Inhalte werden aus js/texts.js erzeugt) -->
  <section id="screen-start" class="screen"></section>
  <section id="screen-summit" class="screen"></section>
  <section id="screen-reveal" class="screen dark"></section>
  <section id="screen-end" class="screen"></section>

  <!-- Reihenfolge ist wichtig.
       ?v=6: Versionsnummer gegen veralteten Browser-Cache. Nach Änderungen
       einfach überall hochzählen (v=4, v=5 …), dann laden alle sofort die neue Version. -->
  <script src="js/config.js?v=6"></script>
  <script src="js/texts.js?v=6"></script>
  <script src="js/assets.js?v=6"></script>
  <script src="js/art.js?v=6"></script>
  <script src="js/level.js?v=6"></script>
  <script src="js/hud.js?v=6"></script>
  <script src="js/work.js?v=6"></script>
  <script src="js/touch.js?v=6"></script>
  <script src="js/game.js?v=6"></script>
  <script src="js/reveal.js?v=6"></script>
  <script src="js/screens.js?v=6"></script>
  <script src="js/main.js?v=6"></script>
</body>
</html>
